# Agent preset chat-subagent: one `@deepseek-ai/dsh-agent-preset` declaration,
# derived from `presets/chat-agent.patch.yml`.
#
# The rule this preset exists to break: `chat-agent` can call nothing, this one
# can call ONE thing that acts — `subagent`, the tool that creates a subagent to
# carry the task out — plus the read-only `list_subagent_models` the
# `modelSelectionSettings` opt-in registers, which only reports the routes the
# session may name. The delegated subagent is a real agent with a real
# (read-only) tool set; the top-level session is the delegator. Its CATALOG holds
# exactly those two names: a depth-0 catalog MASK hides the preset's inherited
# rows from it, and the guard refuses every call outside the two.
#
# WHY NO RESTRICTION ON THE PRESET PLANE, AND WHY THE MASK IS ON THE AGENT. The
# obvious shape — a preset-plane `ctx.tools.restrict({ allow: [] })` next to
# these rows — is wrong, and silently so: a delegated child JOINS ITS PARENT'S
# PRESET (`applyChildComposition` → `agentPresets.composeFrom(childCtx,
# parent.ctx)`, `packages/subagent/subagent/src/child-agent.ts:200-219`), and
# the standing scope's restriction is on the child's chain too, so the child
# would inherit the same empty catalog and the delegation would accomplish
# nothing. A restriction can only narrow, so the child's own `toolFilter`
# cannot undo it. The mask therefore lives on ONE agent's OWN scope and only at
# depth 0 (`delegator.mjs` point 5): `ToolRuntime.view()` filters only the
# surface a scope INHERITS, so that scope's own-layer `subagent` and
# `list_subagent_models` stay visible, and a delegated child never sees the mask
# because its scope parent is the standing scope, not the parent Agent's scope
# (`agent-preset-registry/src/mount.ts:119-127`). It is a CATALOG mask, not
# enforcement: `restrict()` hides names, and the standing GUARD (point 6)
# refuses every call outside the two. `delegator.mjs` carries the mechanism with
# source pointers.
#
# WHY THE MASK INSTALLS ONE MACROTASK LATE. Measured, 1.7.3 live on `dev_web`:
# `restrict()` notifies `tools/change`, and the official delegation plugin
# installs into a live Agent on exactly that event — an agent-scope restriction
# installed synchronously from `agent/created` gave one scope two installs, the
# second threw `tool "list_subagent_models" is already registered in this
# scope`, its `install()` aborted before `mount()`, and the session got NO
# delegation tool at all. The mask is therefore coalesced into one
# `setTimeout(..., 0)` flush, so `restrict()`'s notification never lands inside
# the creation or switch dispatch that asked for it; lifting is deferred the
# same way, so leaving the preset restores the rows. That flush runs one
# macrotask after the dispatch, which is why a catalog read taken inside the
# same tick as `sessionController.create` still shows the inherited rows.
#
# WHY THESE TOOL ROWS. On the `web` profile the host plane's model-facing rows
# are all disabled (`@deepseek-ai/dsh-web-app` `cordis.patch.yml:430-556`), so
# what an agent sees is exactly what its preset mounts, and the child inherits
# this preset's rows like the root session does. These four rows are the
# only source of the names `subagentTools` lists: `read` (plus `write`/`edit`,
# which the guard refuses for both agents), `glob`/`grep`, `todo_write`, and the
# `job_*` family. `write`/`edit`/`bash` are deliberately
# out of the default list: the subagent works read-only in this release (see
# TODO.md for the writable/command-capable follow-up).
#
# Two names in `subagentTools` are NOT ours and may be absent from a deployment:
# `read_image` registers only while an attachment store is mounted
# (`packages/fs/tool-fs/src/index.ts:67-72`), and `list_directory` comes from a
# third-party profile row. Nothing probes for them any more: the guard allows
# those names, and a name that is not registered is simply not in the catalog, so
# a missing tool costs that tool and never the delegation.
#
# THE ONE TOOL THAT ACTS. `@deepseek-ai/dsh-tool-subagent` mounts one
# model-facing delegation tool per instance, on the `spawn` provider (a fresh
# child that never sees this conversation, so a task prompt must stand alone).
# `enableRunInBackground: false` removes `run_in_background` from the schema
# entirely, so the single call waits for the child and returns its report — a
# background start would need `job_output`/`send_message` to collect, and those
# are second tools this preset does not have. `backgroundMode: one-shot` is the
# matching policy. `maxDepth: 1` states the recursion budget outright: the child
# may not delegate again (the guard's child branch keeps only the read-only names
# and does not include `subagent`).
#
# WHY `modelSelectionSettings: true` HERE TOO. With the flag on, the top-level
# session gains the optional `provider`/`model`/`reasoning_effort` parameters on
# `subagent`, and `list_subagent_models` to read the Host's authorized routes —
# so a chat session can name the child's model like the five coding presets do.
# The flag is also a row-level switch on WHERE the tool registers: it moves from
# this preset's standing plane to each Agent's OWN layer — precisely the layer a
# restriction never filters, which is what keeps both delegation names in the
# masked catalog and is why the mask may be `allow: []`. The five coding presets
# keep the flag too, so the only difference is that this preset may CALL one of
# the tools it lists.
#
# WHY THE DELEGATION ROW IS INSIDE A `cordis:group`. Measured, 2026-10-18: a
# preset switch is `agentPresets.select` → `recompose` (a scope rebind plus ONE
# `tools/change`), and the per-Agent install of the INCOMING preset races the
# asynchronous disposal of the OUTGOING one. Their order is listener order,
# which is preset MOUNT order, and a top-level row mounts before the rows of a
# `cordis:group`: a top-level delegation row put this preset FIRST among the
# eleven `tools/change` listeners (measured index 2, before `standard` at 3),
# so every switch INTO this preset registered `list_subagent_models` while
# `standard`'s copy was still there — the duplicate threw, `install()` aborted
# before `mount()`, the failed fiber stayed cached in `scopedInstalls`, and the
# session kept NEITHER tool. Inside this group the listener registers LATE
# (after every other preset's), the outgoing removal runs first, and the switch
# succeeds. This is a workaround, not a fix: the reverse direction (leaving this
# preset for an earlier-indexed one while the session is still blank) collides
# instead. The real fix belongs in `@deepseek-ai/dsh-tool-subagent` (do not
# cache a failed per-Agent install, so the next `tools/change` retries); it is
# recorded in CHANGELOG 1.7.6 and TODO.md. Do not move this row back out of the
# group: the top-level failure was measured on a live profile.
#
# The top-level persona text is NOT here: `delegator.mjs` composes it from the
# shared table `chat-agent` also reads (`presets/shared/model-personas.json`, via
# `presets/shared/model-persona.mjs`) plus the delegation note it reads from
# `presets/chat-subagent/delegation-note.md`. One table, one note, each in one
# file. `persona` below is the CHILD's own persona — a section in the child's
# scope alone, shadowing the deployment persona there.
#
# A pure `insert` with no `!!js` expression: nothing here is platform- or
# environment-conditional.
- insert:
    - id: preset-chat-subagent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-subagent
        order: 16
        name: "通用聊天模式 · 可派活"
        description: "顶层目录只有 subagent 与 list_subagent_models（可为子 agent 指定模型）；其余工具一律拒绝：把任务交给只读子 agent 去查、去读，自己专注对话。"
        plugins:
          # The delegation guard, the depth-0 catalog mask and the delegator
          # persona. `presetId` must equal this declaration's `id` (it is what
          # tells the plugin which live agents belong to this preset during
          # `tools/change` reconciliation); `subagentTools` is the single source
          # of the child's read-only list.
          # An optional `delegationNote` here would REPLACE the shipped
          # `delegation-note.md` for this preset; the shipped declaration sets
          # neither, so the file is what the session's prompt ends with.
          - id: delegator
            name: 'dsh-more-agent-presets/presets/chat-subagent/delegator.mjs'
            config:
              presetId: chat-subagent
              subagentTools:
                - read
                - glob
                - grep
                - read_image
                - list_directory
                - todo_write
                - job_list

          # The one model-facing tool that acts (header). It sits inside a
          # group on purpose: see "WHY THE DELEGATION ROW IS INSIDE A GROUP".
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: one-shot
                  enableRunInBackground: false
                  maxDepth: 1
                  # Authorized routes come from the Host's
                  # `@deepseek-ai/dsh-tool-subagent/model-selection-settings` row,
                  # which the profile must mount: without it this row fails and the
                  # WHOLE preset reports a load failure.
                  modelSelectionSettings: true
                  persona: >-
                    You are a delegated read-only subagent of a chat session. Work only through the tools
                    in your catalog, keep the investigation tight, and answer with a concise report the
                    delegating agent can act on: what you checked, what you found, and anything you could
                    not determine. You cannot modify files, run commands, or delegate further.

          # The child's tool sources. The depth-0 mask hides them from the
          # top-level catalog; the guard also refuses a call to one, so a hidden
          # name can never act.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            # The one key this plugin has no default for (`allowParallelInProgress`
            # is `.required()` in its Config), so a row without it fails to mount
            # and the WHOLE preset reports a load failure. The shipped standard
            # preset passes `true`; this row mirrors that.
            config:
              allowParallelInProgress: true
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # A chat session is long by nature, and a child that greps a repository
          # produces the large tool results the pruner exists for; the top-level
          # session has none, so the row costs it nothing.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
